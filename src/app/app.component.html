<div class="container">
  <picture class="background-wrap">
    <!-- Desktop landscape for wide viewports -->
    <source media="(min-width: 1200px)" type="image/webp" srcset="assets/img/fondo_fiscalia_landscape_1920x1080.webp 1x, assets/img/fondo_fiscalia_landscape_3840x2160.webp 2x, assets/img/fondo_fiscalia_landscape_5760x3240.webp 3x">
    <source type="image/webp" srcset="assets/img/fondo_fiscalia_1.webp 1x, assets/img/fondo_fiscalia_1@2x.webp 2x, assets/img/fondo_fiscalia_1@3x.webp 3x">
    <img
      class="background"
      src="assets/img/fondo_fiscalia_1.png"
      srcset="assets/img/fondo_fiscalia_1.png 1x, assets/img/fondo_fiscalia_1@2x.png 2x, assets/img/fondo_fiscalia_1@3x.png 3x"
      alt="fondo fiscalia"
      loading="eager"
      decoding="async"
      onerror="this.onerror=null; this.src='assets/img/background.svg'; this.style.objectFit='cover';"
    />
  </picture>
  <app-navbar></app-navbar>
  <main class="home">
    <section class="hero">
      <img class="logo" src="assets/img/LogoAzulG.svg" alt="FiscalIA logo" />
      <h1>FiscalIA</h1>
      <p>Bienvenido — describe la narrativa de hechos para evaluar si procede denuncia</p>
      <div class="cta-row">
        <a class="cta" href="/denuncia">Iniciar Denuncia</a>
        <a class="secondary" href="#">Conocer más</a>
      </div>
    </section>
  </main>
</div>
